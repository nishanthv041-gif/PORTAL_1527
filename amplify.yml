version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        # Restore build cache from previous build if available
        - mkdir -p .next
        - '[ -d .amplify-cache/cache ] && cp -r .amplify-cache/cache .next/cache || true'
        - npm ci
        - npx prisma generate
    build:
      commands:
        # Securely pass permitted runtime environment variables to Next.js server runtime without logging secrets
        - env | grep -E '^(DATABASE_URL|DIRECT_URL|SECONDARY_DATABASE_URL|SECONDARY_DIRECT_URL|NEXTAUTH_SECRET|NEXTAUTH_URL|NEXT_PUBLIC_APP_URL|NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY|SUPABASE_SECRET_KEY|SETTINGS_INITIAL_PASSWORD|GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET|SMTP_EMAIL|SMTP_PASSWORD|SMTP_HOST|SMTP_PORT|CRON_SECRET|NODE_ENV)=' > .env.production || true
        - npm run build
    postBuild:
      commands:
        # 1. Clean server source maps from production output (.map files are never executed at runtime)
        - find .next/server -name "*.map" -type f -delete || true
        # 2. Print detailed size audit and enforce packaging budget (< 205 MB limit)
        - node scripts/check-build-size.mjs
        # 3. Move .next/cache into .amplify-cache to preserve fast builds while keeping deployed bundle slim
        - mkdir -p .amplify-cache
        - rm -rf .amplify-cache/cache
        - '[ -d .next/cache ] && mv .next/cache .amplify-cache/cache || true'
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .amplify-cache/**/*
