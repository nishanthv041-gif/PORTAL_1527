name: Continuous Deployment (CD)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # Required for GitHub OIDC authentication
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Migrate & Deploy to AWS EC2
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC (No Static Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU for ARM64 Graviton builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/nipoportal-app:sha-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/nipoportal-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute Remote Zero-Downtime Deployment via AWS SSM
        run: |
          INSTANCE_ID="${{ secrets.AWS_INSTANCE_ID }}"
          IMAGE_TAG="sha-${{ github.sha }}"
          
          echo "🚀 Triggering deployment on EC2 instance ${INSTANCE_ID} via AWS Systems Manager..."
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy nipoportal release ${IMAGE_TAG}" \
            --parameters "commands=[\"bash /opt/nipoportal/deploy/deploy.sh ${IMAGE_TAG}\"]" \
            --query "Command.CommandId" \
            --output text)
            
          echo "📋 SSM Command sent. Command ID: ${COMMAND_ID}"
          echo "⏳ Polling SSM Command execution status..."
          
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
            
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)
            
          echo "Deployment command completed with status: ${STATUS}"
          
          if [ "$STATUS" != "Success" ]; then
            echo "❌ Deployment command failed on target instance!"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi
          
          echo "🎉 Remote deployment finished successfully!"

