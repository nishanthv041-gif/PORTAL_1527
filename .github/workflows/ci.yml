name: Continuous Integration (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, Test & Build Next.js Standalone
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          NEXTAUTH_SECRET: ci-test-secret-min-32-chars-long-placeholder
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Verify Standalone Output Exists
        run: |
          if [ ! -d ".next/standalone" ]; then
            echo "❌ Error: Standalone output directory (.next/standalone) was not generated!"
            exit 1
          fi
          echo "✅ Standalone output verified successfully."

