# High-Concurrency Nginx Reverse Proxy Configuration for SRT Universal School Portal
# Optimized for 1,500+ Concurrent Users on AWS (EC2 / ECS behind ALB)

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # Rate Limiting: 50 requests/sec per IP with burst of 100 for API routes
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:20m;

    # Upstream to Next.js App Cluster (Node.js standalone on port 3000)
    upstream nextjs_upstream {
        server 127.0.0.1:3000;
        keepalive 64;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        client_max_body_size 30M;
        limit_conn conn_limit 50;

        # Healthcheck endpoint for AWS ALB
        location = /api/health/live {
            proxy_pass http://nextjs_upstream;
            access_log off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # CRITICAL PWA RULE: Never cache sw.js
        location = /sw.js {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
            add_header Pragma "no-cache" always;
            expires 0;
        }

        # PWA Manifests: Brief stale-while-revalidate
        location ~* ^/(manifest\.json|manifest\.webmanifest)$ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            add_header Content-Type "application/manifest+json; charset=utf-8" always;
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        }

        # Next.js Static Chunks & Build Artifacts: Immutable 1-Year Cache
        location /_next/static/ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        # Static Icons, Images, Logos
        location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|avif|woff2?|ttf|eot)$ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        # API Routes: Rate limited with buffering and zero-cache
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        }

        # Dynamic App Router Default Proxy
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }
}
